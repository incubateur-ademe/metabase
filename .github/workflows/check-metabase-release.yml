name: 🔄 Check for new Metabase release

on:
  schedule:
    - cron: '13 7 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Redeploy only this environment (leave empty to check all SEs)
        required: false
        type: string

permissions:
  contents: read
  actions: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.list.outputs.environments }}
      latest: ${{ steps.latest.outputs.tag }}
    steps:
      - name: 🔍 Get latest Metabase release tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/metabase/metabase/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 📋 List SE deploy environments
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.environment }}" ]; then
            envs='["${{ inputs.environment }}"]'
          else
            envs=$(gh api "repos/${{ github.repository }}/environments" --paginate \
              --jq '[.environments[].name]')
          fi
          echo "environments=$envs" >> "$GITHUB_OUTPUT"

      - name: 📣 Announce release and targets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Metabase ${{ steps.latest.outputs.tag }} — targets: ${{ steps.list.outputs.environments }}"
            echo
            gh api "repos/metabase/metabase/releases/tags/${{ steps.latest.outputs.tag }}" --jq .body
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: check-release
    if: needs.check-release.outputs.environments != '[]'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions: write-all
    strategy:
      matrix:
        environment: ${{ fromJson(needs.check-release.outputs.environments) }}
    steps:
      - name: ⚖️ Compare against last deployed version for this SE
        id: compare
        run: |
          last=${{vars.LAST_DEPLOYED_METABASE_VERSION}}
          echo "Environment: ${{ matrix.environment }}"
          echo "Latest release: ${{ needs.check-release.outputs.latest }}"
          echo "Last deployed:  $last"
          if [ "$last" != "${{ needs.check-release.outputs.latest }}" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.compare.outputs.new == 'true'
        with:
          fetch-depth: 0

      - name: 🧭 Resolve Scalingo target from the remote
        id: target
        if: steps.compare.outputs.new == 'true'
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          SCALINGO_GIT_REMOTE: ${{ secrets.SCALINGO_GIT_REMOTE }}
          # remote looks like git@ssh.<region>.scalingo.com:<app-name>.git
          REMOTE_PATTERN: '^git@(ssh\.([a-z0-9-]+)\.scalingo\.com):([a-zA-Z0-9._-]+)\.git$'
        run: |
          set -euo pipefail
          # One anchored match for the whole remote: a partial match must not
          # yield a half-resolved target. Bail out rather than ssh-keyscan a
          # host we did not resolve, or build a URL out of unparsed input.
          if [[ ! "$SCALINGO_GIT_REMOTE" =~ $REMOTE_PATTERN ]]; then
            echo "::error::SCALINGO_GIT_REMOTE is malformed for environment $ENVIRONMENT: expected git@ssh.<region>.scalingo.com:<app>.git" >&2
            exit 1
          fi
          ssh_host="${BASH_REMATCH[1]}"
          region="${BASH_REMATCH[2]}"
          app="${BASH_REMATCH[3]}"

          echo "Region: $region"
          {
            echo "ssh_host=$ssh_host"
            echo "app=$app"
            echo "region=$region"
          } >> "$GITHUB_OUTPUT"

      - name: 🔑 Set up Scalingo SSH deploy key
        if: steps.compare.outputs.new == 'true'
        env:
          SSH_HOST: ${{ steps.target.outputs.ssh_host }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SCALINGO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_scalingo
          chmod 600 ~/.ssh/id_scalingo
          ssh-keyscan -t rsa,ecdsa,ed25519 "$SSH_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host $SSH_HOST"
            echo "  IdentityFile ~/.ssh/id_scalingo"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: 🚀 Push to Scalingo to trigger redeploy
        if: steps.compare.outputs.new == 'true'
        run: |
          git remote add scalingo "${{ secrets.SCALINGO_GIT_REMOTE }}"
          git push scalingo HEAD:master --force


      - name: 🔗 Report deployment URL
        if: steps.compare.outputs.new == 'true'
        run: |
          echo "### ${{ matrix.environment }}: https://${{ steps.target.outputs.app }}.${{ steps.target.outputs.region }}.scalingo.io" >> "$GITHUB_STEP_SUMMARY"
