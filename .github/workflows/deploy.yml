name: Deploy to Scalingo

on:
  workflow_dispatch:
    inputs:
      version:
        description: Metabase release tag that triggered this deploy
        required: false
        default: manual

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: metabase
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Scalingo SSH deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SCALINGO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_scalingo
          chmod 600 ~/.ssh/id_scalingo
          ssh-keyscan -t rsa,ecdsa,ed25519 ssh.osc-secnum-fr1.scalingo.com >> ~/.ssh/known_hosts
          {
            echo "Host ssh.osc-secnum-fr1.scalingo.com"
            echo "  IdentityFile ~/.ssh/id_scalingo"
            echo "  IdentitiesOnly yes"
          } >> ~/.ssh/config

      - name: Push to Scalingo to trigger redeploy
        run: |
          git remote add scalingo "${{ secrets.SCALINGO_GIT_REMOTE }}"
          git push scalingo HEAD:master --force

      - name: Record deployed version
        if: inputs.version != 'manual'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh variable set LAST_DEPLOYED_METABASE_VERSION --body "${{ inputs.version }}"
